[project]
name = "python-avanzado"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "JottaOS", email = "juanmendozasfa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "pymysql>=1.2.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
python-avanzado = "python_avanzado:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.4",
]

[tool.uv]
package = false
